name: bio_secure_flutter
description: BioSecure multiplataforma (Flutter) - migracion de la app Android.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # Auth / biometrics
  google_sign_in: ^6.2.1
  local_auth: ^2.3.0

  # Location / maps
  geolocator: ^13.0.1

  # Camera / ML
  camera: ^0.12.2
  google_mlkit_face_detection: ^0.12.0

  # QR
  mobile_scanner: ^5.2.3
  qr_flutter: ^4.1.0

  # UI
  fl_chart: ^0.69.0

  # Utils
  path: ^1.9.0
  intl: ^0.20.3
  uuid: ^4.5.1
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2

  # Navigation
  go_router: ^14.3.0

  # Compartir / mapas sin API key
  share_plus: ^12.0.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  # fonts:
  #   - family: ...
